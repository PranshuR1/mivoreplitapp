<!doctype html><html><head><meta charset='utf-8'><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');
:root{--dark:#161008;--socket:#2A1D14;--cream:#FAF3E8;--ink:#3D2313;--body:#6E5238;--amber:#D4872A;
--amber-lt:#E29A50;--dk-body:#C8B39B;--dk-muted:#A8896F;--sticker:#F6E8C8}
@page{margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{position:relative;overflow:hidden;break-after:page}
.page:last-child{break-after:auto}
.dark{background:var(--dark);color:var(--cream)}
.light{background:var(--cream);color:var(--ink)}
.art{position:absolute;left:0;top:0;width:100%;height:100%}
.trim{position:absolute;left:.125in;top:.125in}
.abs{position:absolute}
.eyebrow{font-weight:600;font-size:6.6pt;line-height:1;letter-spacing:.22em;text-transform:uppercase}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.cap{font-weight:600;font-size:6.2pt;line-height:1;letter-spacing:.2em;text-transform:uppercase}
.sub{font-size:9pt;line-height:1.5}
.step .n{font:italic 400 30pt/1 'Instrument Serif',Georgia,serif;color:var(--amber)}
.step h3{font-weight:600;font-size:11pt;line-height:1.2;margin:.1in 0 .05in}
.step p{font-size:8.3pt;line-height:1.5;color:var(--body)}
.fine{font-size:6.4pt;line-height:1.55;color:var(--body)}
.sticker{position:absolute;border-radius:50%;background:var(--sticker);display:grid;place-items:center;
box-shadow:0 .02in .05in rgba(0,0,0,.45)}
.sticker img{width:66%;display:block}
.guide .trim{outline:1px dashed rgba(255,0,0,.8)}
.guide .safe{position:absolute;left:.25in;top:.25in;right:.25in;bottom:.25in;outline:1px dashed rgba(0,160,255,.8)}
@page{size:6.25in 4.25in}.page{width:6.25in;height:4.25in}</style></head><body class='guide'><section class='page dark'><svg class='art' viewBox='-0.125 -0.125 6.25 4.25' xmlns='http://www.w3.org/2000/svg'><circle cx='4.4' cy='2.0' r='0.5521259842519686' fill='#2A1D14' stroke='#D4872A' stroke-width='.012'/><circle cx='4.4' cy='2.0' r='0.752' fill='none' stroke='#D4872A' stroke-opacity='0.4' stroke-width='.01'/><circle cx='4.4' cy='2.0' r='0.952' fill='none' stroke='#D4872A' stroke-opacity='0.22' stroke-width='.01'/><circle cx='4.4' cy='2.0' r='1.152' fill='none' stroke='#D4872A' stroke-opacity='0.1' stroke-width='.01'/></svg><div class='trim' style='width:6in;height:4in'><img class='abs' src='../assets/logo-dark.png' style='left:.5in;top:.5in;height:.52in'><div class='abs eyebrow' style='left:.5in;top:1.42in;color:var(--amber-lt)'>Your Mivo Spot</div><h1 class='abs serif' style='left:.5in;top:1.62in;width:2.7in;font-size:33pt;line-height:1.02'>Pause before<br>you scroll.</h1><p class='abs sub' style='left:.5in;top:2.72in;width:2.3in;color:var(--dk-body)'>Peel it off and stick it where you reach for your phone.</p><div class='abs cap' style='left:.5in;top:3.48in;color:var(--dk-muted)'>Not a block &mdash; a choice.</div><div class='abs cap' style='left:3.0000000000000004in;width:2.8in;top:3.48in;text-align:center;color:var(--amber-lt)'>Tap here with your iPhone</div><div class='sticker' style='background:#F6F4EE;left:3.908in;top:1.508in;width:0.984in;height:0.984in'></div><div class='safe'></div></div></section></body></html>
