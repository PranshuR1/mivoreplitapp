services:
  - type: web
    name: mivo-email-server
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: mivo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MIVO_GMAIL_USER
        value: info.mivoapp@gmail.com
      - key: MIVO_DATA_DIR
        value: /var/data
      - key: MIVO_GMAIL_APP_PASSWORD
        sync: false
      - key: MIVO_EMAIL_API_KEY
        generateValue: true
