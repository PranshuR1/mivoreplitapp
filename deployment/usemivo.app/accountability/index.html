<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Private Mivo Summary</title>
  <style>
    :root{color-scheme:light;--bg:#f4ece3;--card:#fffaf4;--text:#5a3017;--muted:#9c7358;--accent:#d88922;--line:#e3cdb8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(620px,calc(100% - 32px));margin:48px auto}.brand{font-size:14px;font-weight:800;color:var(--accent);text-transform:uppercase}
    h1{font-size:30px;margin:8px 0 6px}.sub{color:var(--muted);margin:0 0 24px}.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:8px;padding:14px}.metric strong{display:block;font-size:22px}.metric span{color:var(--muted);font-size:13px}
    .row{padding:14px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.label{font-size:12px;text-transform:uppercase;color:var(--accent);font-weight:800}.value{margin-top:4px;line-height:1.45}
    footer{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.5}@media(max-width:480px){main{margin:24px auto}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main><div class="brand">Mivo</div><h1>Private weekly summary</h1><p class="sub" id="period">Loading summary...</p><section class="panel" id="content"><p>Checking this secure link.</p></section><footer>This page never shows app names, exact usage times, triggers, reflections, or session notes. The sender can revoke access at any time.</footer></main>
<script>
  const endpoint="https://pgmbqxcshgvznxdbpyre.supabase.co/functions/v1/accountability-summary";
  const token=new URLSearchParams(location.search).get("token")||"";
  const safe=(value)=>String(value??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  fetch(`${endpoint}?token=${encodeURIComponent(token)}`).then(async(r)=>{const body=await r.json();if(!r.ok)throw new Error(body.error||"unavailable");return body}).then(({week_start,week_end,summary:s})=>{
    document.getElementById("period").textContent=`${week_start} to ${week_end}`;
    document.getElementById("content").innerHTML=`<div class="grid"><div class="metric"><strong>${safe(s.plannedMinutes)} min</strong><span>planned sessions</span></div><div class="metric"><strong>${safe(s.reflectedDays)}</strong><span>reflected days</span></div></div><div class="row"><div class="label">Truth accuracy</div><div class="value">${safe(s.truthAccuracyTrend)}</div></div><div class="row"><div class="label">Experiment</div><div class="value">${safe(s.experimentStatus)}</div></div><div class="row"><div class="label">Weekly note</div><div class="value">${safe(s.encouragement)}</div></div>`;
  }).catch(()=>{document.getElementById("period").textContent="This link is unavailable";document.getElementById("content").innerHTML="<p>This summary link has expired, was revoked, or is invalid.</p>"});
</script></body></html>
