<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Mivo</title>
  <style>
    body { margin: 0; background: #FAF3E8; color: #5C3317; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    section { width: min(440px, 100%); text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 8px; background: #F0E4CC; color: #B5621E; font-size: 24px; font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { line-height: 1.5; color: #B5621E; }
    a { display: block; margin-top: 18px; padding: 15px; border-radius: 8px; background: #D4872A; color: white; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <main><section>
    <div class="logo">mivo</div>
    <h1>You've been invited to Mivo</h1>
    <p id="code">Opening your referral...</p>
    <a id="open" href="https://usemivo.app">Open Mivo</a>
  </section></main>
  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const code = (parts[1] || '').toUpperCase();
    const deepLink = `mivo://referral?code=${encodeURIComponent(code)}`;
    document.getElementById('code').textContent = code ? `Referral code: ${code}` : 'Open Mivo to continue.';
    document.getElementById('open').href = deepLink;
    if (code) location.href = deepLink;
  </script>
</body>
</html>
