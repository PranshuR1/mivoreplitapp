services:
  - type: web
    name: mivo-auth-server
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: mivo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MIVO_DATA_DIR
        value: /var/data
